name: Release

# Releasing: bump "version" in mygo.json, commit it, then push the matching tag.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag creates a draft release, each platform job builds its installers with
# the MyGo CLI and attaches them to it, and the last job publishes it. When the
# UPDATE_PRIVATE_KEY secret is set, the builds also sign the update files and
# attach them: the update-<platform>.json manifests must reach the published
# release — which is --latest, what update checks read — or update checks
# find nothing.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # creating the release, and uploading its assets

jobs:
  test:
    name: Test
    runs-on: macos-latest # the platform the tests are verified on
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Use the published Onevra
        run: |
          # go.mod's replace points at a checkout that exists only on the machine
          # that added it; dropping it, go.sum needs the released module's hashes
          go mod edit -dropreplace github.com/oneo-me/onevra/source
          GOFLAGS=-mod=mod go build ./...
      - run: go test ./...

  draft:
    name: Draft the release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag against the version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "Sunvale $GITHUB_REF_NAME" --generate-notes

  build:
    name: ${{ matrix.name }}
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Assets cover the installers plus what `mygo build` writes for signed
          # updates next to them: the update-<platform>.json manifests (which
          # must be attached for update checks to work), the signed .tar.gz
          # update archives, and the .delta files. None of the update files
          # exist when UPDATE_PRIVATE_KEY is unset, and deltas exist only once
          # a signed release is published — the upload step ignores globs that
          # matched nothing. install.sh is identical for both Linux platforms
          # (it picks its target from uname at runtime), so only one is attached.
          - name: macOS
            os: macos-latest
            platform: darwin/universal
            assets: dist/darwin-universal/*.dmg dist/darwin-universal/*.tar.gz dist/darwin-universal/*.delta dist/darwin-universal/update-darwin-universal.json
          - name: Windows
            os: ubuntu-latest
            platform: windows/amd64,windows/arm64
            assets: dist/windows-*/*Setup*.exe dist/windows-*/*.tar.gz dist/windows-*/*.delta dist/windows-*/update-windows-*.json
          - name: Linux
            os: ubuntu-latest
            platform: linux/amd64,linux/arm64
            assets: dist/linux-*/*.deb dist/linux-*/*.tar.gz dist/linux-*/*.delta dist/linux-*/update-linux-*.json dist/linux-amd64/install.sh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Use the published Onevra
        run: |
          go mod edit -dropreplace github.com/oneo-me/onevra/source
          GOFLAGS=-mod=mod go build ./...
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build the installers
        env:
          # Signs the update files (the secret holds mygo-update.key, from
          # `mygo keygen`); without it the build still succeeds and only skips
          # the update files (docs/updates.md), so CI works before the secret
          # is configured.
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: |
          cli="github.com/egoist/mygo/cmd/mygo@$(go list -m -f '{{.Version}}' github.com/egoist/mygo)"
          go run "$cli" build -platform "${{ matrix.platform }}"
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Update-file globs may match nothing (no UPDATE_PRIVATE_KEY secret,
          # or no earlier signed release to delta from): drop them rather than
          # pass the literal patterns to gh as file names.
          shopt -s nullglob
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            ${{ matrix.assets }} --clobber

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
